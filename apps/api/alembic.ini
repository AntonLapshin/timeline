# Alembic configuration for the timeline API.
# The SQLAlchemy URL is read from the app settings at runtime (env.py), so no
# credentials live here. Database file lives under ./data (gitignored).

[alembic]
script_location = alembic
prepend_sys_path = .
# The migration's revision id, auto-generated by `alembic revision`.
# sqlalchemy.url is intentionally left blank; env.py derives it from Settings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
