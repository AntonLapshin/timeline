# Timeline — local development / daily-driver compose stack.
#
# Runs the web app and the API for local development. Host-side exposure is
# loopback-only (the 127.0.0.1 prefix in `ports`); inside the containers the
# servers bind 0.0.0.0 because Docker port publishing forwards to the
# container's eth0 — a loopback bind inside the container would make the
# published ports unreachable.
#
#   docker compose up --build
#
# Then open http://127.0.0.1:8123 (web) and check http://127.0.0.1:8124/healthz
# (API). The SQLite database persists in the `timeline-data` volume.
#
# Secrets come from a local `.env` file (copy `.env.example` → `.env`); nothing
# secret is ever committed. See README "Local run paths".

name: timeline

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: timeline-web
    # Host-side exposure stays loopback-only (no auth); the container itself
    # must bind 0.0.0.0 for Docker port publishing to work.
    ports:
      - "127.0.0.1:8123:8123"
    depends_on:
      - api
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: timeline-api
    # Host-side exposure stays loopback-only (no auth); the container itself
    # must bind 0.0.0.0 for Docker port publishing to work, which requires the
    # explicit TIMELINE_ALLOW_NON_LOOPBACK opt-in (bind guard, issue #97).
    ports:
      - "127.0.0.1:8124:8124"
    env_file:
      - .env
    environment:
      TIMELINE_HOST: 0.0.0.0
      TIMELINE_PORT: 8124
      TIMELINE_DATA_DIR: /data
      TIMELINE_ALLOW_NON_LOOPBACK: "1"
    volumes:
      - timeline-data:/data
    restart: on-failure

volumes:
  timeline-data:
