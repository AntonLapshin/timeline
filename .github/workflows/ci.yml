# CI pipeline for timeline (monorepo).
#
# Runs on every push to `main` (and on pull requests): installs dependencies,
# lints (web eslint max-warnings 0 + backend ruff/mypy), runs the test suites
# (Vitest with 100% core coverage + pytest), scans for secrets (gitleaks),
# builds the production bundle, and uploads the `dist/` artifact.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Web lint (eslint max-warnings 0)
        run: npm run lint

      - name: Web test with coverage (core 100%)
        run: npm run test:coverage

      - name: Web build
        run: npm run build

      - name: Backend lint (ruff)
        working-directory: apps/api
        run: ruff check app tests

      - name: Backend format check (ruff format)
        working-directory: apps/api
        run: ruff format --check app tests

      - name: Backend typecheck (mypy)
        working-directory: apps/api
        run: mypy --config-file pyproject.toml app

      - name: Backend tests (pytest)
        working-directory: apps/api
        run: pytest

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/web/dist
          if-no-files-found: error
